<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudVault — Register</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>

<nav class="navbar">
    <div class="navbar-brand">
        <i class="ti ti-cloud"></i>
        <span>CloudVault</span>
    </div>
</nav>

<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <i class="ti ti-user-plus"></i>
            <h2>Create account</h2>
            <p>Your personal cloud vault awaits</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">
                    <i class="ti ti-{{ 'alert-circle' if category == 'error' else 'circle-check' }}"></i>
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}

        <form action="/register" method="POST" autocomplete="off">
            <div class="form-group">
                <label>Username</label>
                <div class="input-wrap">
                    <i class="ti ti-user"></i>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>
            </div>
            <div class="form-group">
                <label>Password</label>
                <div class="input-wrap">
                    <i class="ti ti-lock"></i>
                    <input type="password" name="password" placeholder="Choose a password" required autocomplete="new-password">
                </div>
            </div>
            <button type="submit" class="full-btn">
                Create account
                <i class="ti ti-arrow-right"></i>
            </button>
        </form>

        <p class="auth-link">Already have an account? <a href="/login">Login here</a></p>
    </div>
</div>

</body>
</html>
